<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Engine Dashboard</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .logo-area span {
      color: var(--accent-blue);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card h3 {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .api-tester-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    button {
      background-color: var(--accent-blue);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    pre {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      color: var(--accent-blue);
      overflow-x: auto;
      min-height: 100px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-area">
        <h1>Stock<span>Engine</span> Dashboard</h1>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        Frontend Active
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <h3>Environment</h3>
        <div class="value" id="env-val">Development</div>
      </div>
      <div class="card">
        <h3>Backend API Status</h3>
        <div class="value" id="api-status">Disconnected</div>
      </div>
      <div class="card">
        <h3>Active Target</h3>
        <div class="value" style="font-size: 1.2rem; word-break: break-all;" id="target-url">/api/health</div>
      </div>
    </div>

    <div class="api-tester-card">
      <h2>Backend Proxy & API Test</h2>
      <p style="color: var(--text-muted); margin-top: 0.25rem;">
        Click below to test routing requests from the frontend through Nginx to your Node/Express backend.
      </p>

      <div class="controls">
        <button onclick="fetchHealth()">Ping /api/health</button>
        <button onclick="fetchItems()" style="background-color: var(--accent-emerald);">Fetch /api/items</button>
      </div>

      <pre id="json-output">// API response payload will render here...</pre>
    </div>
  </div>

  <script>
    const outputEl = document.getElementById('json-output');
    const apiStatusEl = document.getElementById('api-status');

    async function fetchHealth() {
      outputEl.textContent = "Fetching /api/health...";
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
        apiStatusEl.textContent = "Connected";
        apiStatusEl.style.color = "var(--accent-emerald)";
      } catch (err) {
        outputEl.textContent = `Error connecting to /api/health:\n${err.message}`;
        apiStatusEl.textContent = "Error";
        apiStatusEl.style.color = "var(--danger)";
      }
    }

    async function fetchItems() {
      outputEl.textContent = "Fetching /api/items...";
      try {
        const res = await fetch('/api/items');
        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outputEl.textContent = `Error connecting to /api/items:\n${err.message}`;
      }
    }
  </script>
</body>
</html>
