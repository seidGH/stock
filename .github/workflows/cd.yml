name: Stock Front CD

on:
  workflow_run:
    workflows: ["Stock Frontend CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::173639292042:role/github-actions-stock-deploy
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to EC2 through SSM
        run: |
          aws ssm send-command \
            --instance-ids i-05aef3c5214d09f42 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Stock application" \
            --parameters 'commands=[
              "cd /home/ec2-user/stock",
              "git pull origin main",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --output text



