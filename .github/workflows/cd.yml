name: Stock Front CD

on:
  workflow_run:
    workflows: ["Stock Frontend CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::173639292042:role/github-actions-stock-deploy
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy frontend to EC2 through SSM
        run: |
          aws ssm send-command \
            --instance-ids i-05aef3c5214d09f42 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Stock frontend" \
            --parameters 'commands=[
              "set -e",
              "docker pull seiddk/stock-frontend:latest",
              "docker rm -f stock-frontend || true",
              "docker run -d --restart unless-stopped --name stock-frontend -p 80:80 seiddk/stock-frontend:latest",
              "docker ps --filter name=stock-frontend",
              "curl -f --retry 5 --retry-delay 2 http://localhost/"
            ]' \
            --query 'Command.CommandId' \
            --output text
